version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/be"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "build"
      include: "scope"
    versioning-strategy: "increase-if-necessary"
    ignore:
      # Major npm upgrades are handled as planned manual work so they do not
      # get mixed into auto-mergeable grouped dependency PRs.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # source-map 0.8 changes SourceMapConsumer construction to an async API.
      # Keep 0.6.x until browserStackSymbolicationService is migrated manually.
      - dependency-name: "source-map"
        update-types:
          - "version-update:semver-minor"
    groups:
      backend-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ui"
    commit-message:
      prefix: "build"
      include: "scope"
    versioning-strategy: "increase-if-necessary"
    ignore:
      # Major npm upgrades are handled as planned manual work so they do not
      # get mixed into auto-mergeable grouped dependency PRs.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Mantine 7.17 typings require newer TypeScript syntax than the UI's
      # pinned TypeScript 4.9 compiler supports. Keep 7.9.x until a planned
      # TypeScript/Mantine upgrade is done together.
      - dependency-name: "@mantine/*"
        update-types:
          - "version-update:semver-minor"
    groups:
      ui-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/ui-server"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ui-server"
    commit-message:
      prefix: "build"
      include: "scope"
    versioning-strategy: "increase-if-necessary"
    ignore:
      # Major npm upgrades are handled as planned manual work so they do not
      # get mixed into auto-mergeable grouped dependency PRs.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      ui-server-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
