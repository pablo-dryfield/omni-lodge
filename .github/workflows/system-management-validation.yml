name: System Management validation
on:
  workflow_call:
permissions:
  contents: read
env:
  NODE_VERSION: "22.23.2"
  NPM_VERSION: "10.9.8"
jobs:
  validate:
    name: Isolated runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: system-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            management-server/package-lock.json
            management-ui/package-lock.json
            be/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install and validate isolated packages
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          npm --prefix management-server ci --ignore-scripts
          npm --prefix management-server run check
          npm --prefix management-server test
          npm --prefix management-server run build
          npm --prefix management-ui ci
          npm --prefix management-ui run check
          npm --prefix management-ui test
          npm --prefix management-ui run build
          go -C ops/system-management/adapter test ./...
          mkdir -p ops/system-management/bin
          CGO_ENABLED=0 go -C ops/system-management/adapter build -trimpath -ldflags '-s -w' -o ../bin/adapter .
          npm --prefix be ci --include=dev
          npm --prefix be run build:prod
          node --test ops/production/system-ingress-guard.test.mjs
      - name: Ensure isolated runtime OS dependencies
        run: |
          set -euo pipefail
          # Hosted runners already provide these tools; avoid fetching a redundant metapackage.
          missing_packages=()
          if ! test -x /usr/sbin/sshd || ! test -x /usr/lib/openssh/sftp-server; then
            missing_packages+=(openssh-server)
          fi
          if ! psql --version >/dev/null 2>&1; then
            missing_packages+=(postgresql-client-16)
          fi
          if (( ${#missing_packages[@]} )); then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends "${missing_packages[@]}"
          fi
          test -x /usr/sbin/sshd
          test -x /usr/lib/openssh/sftp-server
          psql --version
          sudo systemctl start ssh
      - name: Verify actual Linux/OpenSSH/PostgreSQL boundaries and orphan recovery
        run: |
          MANAGEMENT_TEST_ADMIN_URL=postgresql://postgres:system-ci-only@127.0.0.1:5432/postgres \
            node management-server/node_modules/tsx/dist/cli.mjs --test management-server/test/postgres.integration.ts
          sudo env PATH="$PATH" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            SYSTEM_MANAGEMENT_LINUX_TEST_REQUIRED=true \
            MANAGEMENT_TEST_ADMIN_URL=postgresql://postgres:system-ci-only@127.0.0.1:5432/postgres \
            node management-server/node_modules/tsx/dist/cli.mjs --test management-server/test/linux.integration.ts
