# This account is a protocol endpoint, not an interactive login.
Match User omnilodge-deploy
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    AuthorizedKeysFile /etc/ssh/authorized_keys/omnilodge-deploy
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitUserRC no
    GatewayPorts no
    PermitOpen none
    PermitListen none
    ForceCommand /usr/local/libexec/omnilodge/ssh-gateway

# Do not let the Match block affect accounts parsed after this include.
Match all
